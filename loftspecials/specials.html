<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Loft — Specials</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1a1a;
      --muted: #666;
      --border: #ddd;
      --bg: #f7f6f3;
      --card-bg: #fff;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 24px 16px 60px;
      color: var(--ink);
    }

    .app { max-width: 600px; margin: 0 auto; }

    .app-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 28px;
    }

    .section-hdr {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 28px 0 10px;
    }

    .form-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px 18px 18px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }

    label.field-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    input[type="text"], textarea {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
      -webkit-appearance: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: var(--ink);
    }

    textarea { resize: vertical; min-height: 72px; line-height: 1.5; }

    /* Specials list */
    #specials-list { display: flex; flex-direction: column; gap: 14px; }

    .special-item {
      border: 1.5px solid #e8e8e8;
      border-radius: 10px;
      padding: 14px 12px 12px;
      background: #fafaf9;
    }

    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .item-num {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .btn-remove {
      background: none;
      border: none;
      color: #bbb;
      font-size: 1.1rem;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .btn-remove:hover { background: #fee; color: #c55; }

    .item-fields { display: flex; flex-direction: column; gap: 8px; }

    /* File upload */
    .file-upload-label {
      display: block;
      background: #f0efe9;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 13px 16px;
      font-size: 0.9rem;
      color: #888;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, background 0.15s;
    }
    .file-upload-label:hover, .file-upload-label:active {
      border-color: #bbb;
      background: #e8e7e1;
    }
    .file-upload-label input[type="file"] { display: none; }
    .file-name { font-weight: 700; color: var(--ink); }

    /* Buttons */
    .btn-add {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      background: none;
      border: 2px dashed #d0d0d0;
      border-radius: 10px;
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #aaa;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-add:hover { border-color: #aaa; color: #555; }

    .btn-row {
      display: flex;
      gap: 10px;
      margin: 24px 0 0;
    }

    .btn-clear, .btn-print, .btn-pdf {
      flex: 1;
      padding: 16px 10px;
      font-family: 'Lato', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-clear { background: #efefef; color: #555; flex: 0 0 80px; }
    .btn-print { background: #555; color: #fff; }
    .btn-pdf   { background: var(--ink); color: #fff; }
    button:active { transform: scale(0.97); opacity: 0.85; }

    .print-tip {
      margin-top: 10px;
      font-size: 0.72rem;
      color: #bbb;
      text-align: center;
      line-height: 1.5;
    }
    .print-tip strong { color: #999; }

    /* Previews */
    .preview-wrap {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      margin-top: 24px;
    }

    .preview-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #bbb;
      text-align: center;
      margin-bottom: 12px;
    }

    /* 4-up grid */
    .specials-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      aspect-ratio: 8.5 / 11;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }

    /* ── FRONT CARD ── */
    .special-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      text-align: center;
      border: 1px dashed #d0d0d0;
    }

    .card-special { width: 100%; }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
    }

    .card-description {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-style: italic;
      color: #555;
      line-height: 1.45;
      margin-top: 3px;
    }

    .card-price {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      color: var(--ink);
      margin-top: 4px;
    }

    .item-sep {
      display: flex;
      align-items: center;
      width: 55%;
      margin: 0 auto;
    }
    .item-sep::before, .item-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #ddd;
    }
    .item-sep span { color: #ccc; padding: 0 5px; line-height: 1; }

    /* Front font scaling by item count */
    .specials-grid[data-count="1"] .card-title       { font-size: clamp(12px, 2.8vw, 22px); }
    .specials-grid[data-count="1"] .card-description { font-size: clamp(8px, 1.5vw, 12px); }
    .specials-grid[data-count="1"] .card-price       { font-size: clamp(11px, 2.2vw, 17px); }
    .specials-grid[data-count="1"] .item-sep         { margin: 8px auto; }
    .specials-grid[data-count="1"] .item-sep span    { font-size: 10px; }

    .specials-grid[data-count="2"] .card-title       { font-size: clamp(11px, 2.3vw, 18px); }
    .specials-grid[data-count="2"] .card-description { font-size: clamp(7px, 1.3vw, 10px); }
    .specials-grid[data-count="2"] .card-price       { font-size: clamp(10px, 1.9vw, 15px); }
    .specials-grid[data-count="2"] .item-sep         { margin: 7px auto; }
    .specials-grid[data-count="2"] .item-sep span    { font-size: 9px; }

    .specials-grid[data-count="3"] .card-title       { font-size: clamp(10px, 1.9vw, 15px); }
    .specials-grid[data-count="3"] .card-description { font-size: clamp(6.5px, 1.1vw, 9px); }
    .specials-grid[data-count="3"] .card-price       { font-size: clamp(9px, 1.6vw, 13px); }
    .specials-grid[data-count="3"] .item-sep         { margin: 5px auto; }
    .specials-grid[data-count="3"] .item-sep span    { font-size: 8px; }

    .specials-grid[data-count="4"] .card-title       { font-size: clamp(9px, 1.6vw, 13px); }
    .specials-grid[data-count="4"] .card-description { font-size: clamp(6px, 1vw, 8px); }
    .specials-grid[data-count="4"] .card-price       { font-size: clamp(8px, 1.4vw, 11px); }
    .specials-grid[data-count="4"] .item-sep         { margin: 4px auto; }
    .specials-grid[data-count="4"] .item-sep span    { font-size: 7px; }

    .specials-grid[data-count="5"] .card-title       { font-size: clamp(8px, 1.4vw, 11px); }
    .specials-grid[data-count="5"] .card-description { font-size: clamp(5.5px, 0.9vw, 7.5px); }
    .specials-grid[data-count="5"] .card-price       { font-size: clamp(7px, 1.2vw, 10px); }
    .specials-grid[data-count="5"] .item-sep         { margin: 3px auto; }
    .specials-grid[data-count="5"] .item-sep span    { font-size: 6.5px; }

    /* ── BACK CARD ── */
    .back-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      text-align: center;
      border: 1px dashed #d0d0d0;
    }

    .back-card-hdr {
      font-family: 'Playfair Display', serif;
      font-size: clamp(9px, 1.8vw, 14px);
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .back-card-rule {
      width: 55%;
      height: 1px;
      background: #ccc;
      margin: 5px auto 8px;
    }

    .back-card-img {
      max-width: 38%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .back-card-img-placeholder {
      width: 38%;
      aspect-ratio: 1 / 1;
      border: 1px dashed #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      font-size: clamp(6px, 1vw, 8px);
      color: #d0d0d0;
      font-family: 'Lato', sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .back-card-comment {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-style: italic;
      color: #555;
      line-height: 1.5;
      font-size: clamp(6px, 1.1vw, 9px);
      width: 90%;
    }

    .back-card-sep {
      width: 30%;
      height: 1px;
      background: #e0e0e0;
      margin: 6px auto;
    }

    /* ── PRINT ── */
    @media print {
      @page { size: letter portrait; margin: 0; }

      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background: white !important;
      }

      .app-title, .section-hdr, .form-card,
      .btn-add, .btn-row, .print-tip, .preview-label { display: none !important; }

      .app {
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .preview-wrap {
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        border-radius: 0 !important;
        background: white !important;
      }

      #front-grid, #back-grid {
        width: 100vw !important;
        height: 100vh !important;
        aspect-ratio: unset !important;
        border: none !important;
        border-radius: 0 !important;
        overflow: visible !important;
      }

      #back-grid {
        page-break-before: always;
        break-before: page;
      }

      /* Cut guides — front */
      .special-card { border: none !important; }
      .special-card:nth-child(1),
      .special-card:nth-child(2) { border-bottom: 1px dashed #bbb !important; }
      .special-card:nth-child(1),
      .special-card:nth-child(3) { border-right: 1px dashed #bbb !important; }

      /* Cut guides — back */
      .back-card { border: none !important; }
      .back-card:nth-child(1),
      .back-card:nth-child(2) { border-bottom: 1px dashed #bbb !important; }
      .back-card:nth-child(1),
      .back-card:nth-child(3) { border-right: 1px dashed #bbb !important; }

      /* Back card print sizes */
      .back-card       { padding: 0.35in 0.38in !important; }
      .back-card-hdr   { font-size: 13pt; }
      .back-card-rule  { width: 2in; margin: 6pt auto 9pt; }
      .back-card-img   { max-width: 1.5in; margin-bottom: 9pt; }
      .back-card-img-placeholder { width: 1.5in; margin-bottom: 9pt; font-size: 7pt; }
      .back-card-comment { font-size: 8pt; line-height: 1.55; }
      .back-card-sep   { margin: 7pt auto; }

      /* Front print sizes per item count */
      .specials-grid[data-count="1"] .special-card     { padding: 0.45in 0.42in !important; }
      .specials-grid[data-count="1"] .card-title       { font-size: 22pt; }
      .specials-grid[data-count="1"] .card-description { font-size: 10.5pt; margin-top: 5pt; }
      .specials-grid[data-count="1"] .card-price       { font-size: 16pt; margin-top: 8pt; }
      .specials-grid[data-count="1"] .item-sep         { margin: 12pt auto; width: 1.8in; }
      .specials-grid[data-count="1"] .item-sep span    { font-size: 8pt; }

      .specials-grid[data-count="2"] .special-card     { padding: 0.42in 0.40in !important; }
      .specials-grid[data-count="2"] .card-title       { font-size: 17pt; }
      .specials-grid[data-count="2"] .card-description { font-size: 9.5pt; margin-top: 4pt; }
      .specials-grid[data-count="2"] .card-price       { font-size: 13pt; margin-top: 6pt; }
      .specials-grid[data-count="2"] .item-sep         { margin: 10pt auto; width: 1.6in; }
      .specials-grid[data-count="2"] .item-sep span    { font-size: 7.5pt; }

      .specials-grid[data-count="3"] .special-card     { padding: 0.38in 0.38in !important; }
      .specials-grid[data-count="3"] .card-title       { font-size: 14pt; }
      .specials-grid[data-count="3"] .card-description { font-size: 8.5pt; margin-top: 3pt; }
      .specials-grid[data-count="3"] .card-price       { font-size: 11.5pt; margin-top: 5pt; }
      .specials-grid[data-count="3"] .item-sep         { margin: 7pt auto; width: 1.4in; }
      .specials-grid[data-count="3"] .item-sep span    { font-size: 7pt; }

      .specials-grid[data-count="4"] .special-card     { padding: 0.3in 0.35in !important; }
      .specials-grid[data-count="4"] .card-title       { font-size: 12pt; }
      .specials-grid[data-count="4"] .card-description { font-size: 8pt; margin-top: 2pt; }
      .specials-grid[data-count="4"] .card-price       { font-size: 10pt; margin-top: 4pt; }
      .specials-grid[data-count="4"] .item-sep         { margin: 5pt auto; width: 1.2in; }
      .specials-grid[data-count="4"] .item-sep span    { font-size: 6.5pt; }

      .specials-grid[data-count="5"] .special-card     { padding: 0.22in 0.32in !important; }
      .specials-grid[data-count="5"] .card-title       { font-size: 10.5pt; }
      .specials-grid[data-count="5"] .card-description { font-size: 7.5pt; margin-top: 2pt; }
      .specials-grid[data-count="5"] .card-price       { font-size: 9pt; margin-top: 3pt; }
      .specials-grid[data-count="5"] .item-sep         { margin: 4pt auto; width: 1in; }
      .specials-grid[data-count="5"] .item-sep span    { font-size: 6pt; }

      .item-sep::before, .item-sep::after { background: #ccc; }
      .item-sep span { color: #bbb; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1 class="app-title">The Loft — Specials</h1>

    <!-- FRONT FORM -->
    <div class="section-hdr">Front — Specials</div>
    <div class="form-card">
      <div id="specials-list"></div>
      <button class="btn-add" id="btn-add" onclick="addItem()">+ Add Special</button>
    </div>

    <!-- BACK FORM -->
    <div class="section-hdr">Back — Drink Board</div>
    <div class="form-card">
      <div class="field">
        <label class="field-label">Header</label>
        <input type="text" id="back-header" placeholder="On Tap This Week" />
      </div>
      <div class="field">
        <label class="field-label">Image <span style="font-weight:300;text-transform:none;letter-spacing:0">(PNG or JPG — optional)</span></label>
        <label class="file-upload-label">
          <span id="file-name-display">Choose Image</span>
          <input type="file" id="back-image" accept="image/*" />
        </label>
      </div>
      <div class="field">
        <label class="field-label">Comment 1</label>
        <textarea id="back-comment1" placeholder="Printed beer list &amp; cocktail menu is at the printers — scan above for our temporary full drink menu"></textarea>
      </div>
      <div class="field">
        <label class="field-label">Comment 2</label>
        <textarea id="back-comment2" placeholder="News, updates, etc."></textarea>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="btn-row">
      <button class="btn-clear" onclick="clearAll()">Clear</button>
      <button class="btn-print" onclick="window.print()">Print</button>
      <button class="btn-pdf" onclick="generatePDF()">Generate PDF</button>
    </div>
    <p class="print-tip">Safari print dialog → uncheck <strong>Print headers and footers</strong></p>

    <!-- FRONT PREVIEW -->
    <div class="preview-wrap">
      <div class="preview-label">Front Preview — 4 per sheet</div>
      <div class="specials-grid" id="front-grid"></div>
    </div>

    <!-- BACK PREVIEW -->
    <div class="preview-wrap">
      <div class="preview-label">Back Preview — 4 per sheet</div>
      <div class="specials-grid" id="back-grid"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const MAX = 5;
    let items = [{ title: '', desc: '', price: '' }];
    let backImageDataURL = null;

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    /* ── FRONT FORM ── */
    function renderForm() {
      document.getElementById('specials-list').innerHTML = items.map((item, i) => `
        <div class="special-item">
          <div class="item-header">
            <span class="item-num">Special ${i + 1}</span>
            ${items.length > 1
              ? `<button class="btn-remove" onclick="removeItem(${i})">✕</button>`
              : ''}
          </div>
          <div class="item-fields">
            <input type="text" placeholder="Dish name" value="${esc(item.title)}"
              oninput="updateItem(${i},'title',this.value)" />
            <textarea placeholder="Description"
              oninput="updateItem(${i},'desc',this.value)">${esc(item.desc)}</textarea>
            <input type="text" placeholder="Price — e.g. $28" value="${esc(item.price)}"
              oninput="updateItem(${i},'price',this.value)" />
          </div>
        </div>`).join('');

      document.getElementById('btn-add').style.display =
        items.length >= MAX ? 'none' : 'block';

      renderFront();
    }

    function updateItem(i, field, val) {
      items[i][field] = val;
      renderFront();
    }

    function addItem() {
      if (items.length >= MAX) return;
      items.push({ title: '', desc: '', price: '' });
      renderForm();
    }

    function removeItem(i) {
      items.splice(i, 1);
      renderForm();
    }

    /* ── FRONT CARD ── */
    function renderFront() {
      const n = items.length;
      const html = items.map((item, i) => {
        const sep = i < items.length - 1
          ? `<div class="item-sep"><span>✦</span></div>`
          : '';
        return `
          <div class="card-special">
            <div class="card-title">${esc(item.title) || 'Dish Name'}</div>
            <div class="card-description">${esc(item.desc) || 'description'}</div>
            <div class="card-price">${esc(item.price) || '$—'}</div>
          </div>${sep}`;
      }).join('');

      const card = `<div class="special-card">${html}</div>`;
      const grid = document.getElementById('front-grid');
      grid.dataset.count = n;
      grid.innerHTML = card + card + card + card;
    }

    /* ── BACK CARD ── */
    function renderBack() {
      const header   = document.getElementById('back-header').value.trim();
      const comment1 = document.getElementById('back-comment1').value.trim();
      const comment2 = document.getElementById('back-comment2').value.trim();

      const imgHtml = backImageDataURL
        ? `<img class="back-card-img" src="${backImageDataURL}" />`
        : `<div class="back-card-img-placeholder">image</div>`;

      const c2Html = comment2
        ? `<div class="back-card-sep"></div>
           <div class="back-card-comment">${esc(comment2)}</div>`
        : '';

      const card = `
        <div class="back-card">
          <div class="back-card-hdr">${esc(header) || 'Header'}</div>
          <div class="back-card-rule"></div>
          ${imgHtml}
          <div class="back-card-comment">${esc(comment1) || 'Comment 1'}</div>
          ${c2Html}
        </div>`;

      document.getElementById('back-grid').innerHTML = card + card + card + card;
    }

    /* ── IMAGE UPLOAD ── */
    document.getElementById('back-image').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('file-name-display').innerHTML =
        `<span class="file-name">${esc(file.name)}</span>`;
      const reader = new FileReader();
      reader.onload = ev => {
        backImageDataURL = ev.target.result;
        renderBack();
      };
      reader.readAsDataURL(file);
    });

    ['back-header', 'back-comment1', 'back-comment2'].forEach(id => {
      document.getElementById(id).addEventListener('input', renderBack);
    });

    /* ── CLEAR ── */
    function clearAll() {
      items = [{ title: '', desc: '', price: '' }];
      ['back-header', 'back-comment1', 'back-comment2'].forEach(id => {
        document.getElementById(id).value = '';
      });
      backImageDataURL = null;
      document.getElementById('file-name-display').textContent = 'Choose Image';
      document.getElementById('back-image').value = '';
      renderForm();
      renderBack();
    }

    /* ── GENERATE PDF ── */
    async function generatePDF() {
      // Must open window synchronously — iOS blocks popups opened inside async callbacks
      const pdfWin = window.open('', '_blank');
      if (!pdfWin) {
        alert('Allow popups for this page to generate PDFs.');
        return;
      }
      pdfWin.document.write(
        '<html><body style="margin:0;display:flex;align-items:center;justify-content:center;' +
        'height:100vh;font-family:sans-serif;font-size:1.1rem;color:#999;background:#f7f6f3">' +
        'Generating PDF…</body></html>'
      );

      try {
        await document.fonts.ready;

        const opts = { scale: 3, useCORS: true, backgroundColor: '#ffffff' };
        const [frontCanvas, backCanvas] = await Promise.all([
          html2canvas(document.getElementById('front-grid'), opts),
          html2canvas(document.getElementById('back-grid'), opts)
        ]);

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'in', format: 'letter' });

        doc.addImage(frontCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 8.5, 11);
        doc.addPage();
        doc.addImage(backCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 8.5, 11);

        pdfWin.location.href = URL.createObjectURL(doc.output('blob'));

      } catch (err) {
        console.error(err);
        pdfWin.close();
        alert('Could not generate PDF. Please try again.');
      }
    }

    /* ── INIT ── */
    renderForm();
    renderBack();
  </script>
</body>
</html>
